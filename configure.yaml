# Crypto workspace configuration.
#
# Project-specific source, build, dependency, and runtime settings live in
# src/<project>/configure.yaml. Keeping this file limited to workspace paths
# prevents project options from becoming a second central configuration.

paths:
  sources: sources
  build: build
  output: output

# Projects are discovered from src/*/compile.sh. Do not add project settings
# here; add or edit the project's own configure.yaml instead.
