# strongSwan project configuration.
project: strongswan
repo: https://github.com/strongswan/strongswan.git
version: 6.0.6
build_system: autotools
depends_on: openssl

# All project-specific build paths stay here. Relative paths are resolved from
# the workspace root; the toolchain path must contain gcc, make, and friends.
prefix_path: output/strongswan
toolchain_path: /usr/bin

# Target filesystem paths. The build stages these paths below output/ so the
# resulting package can be installed on another compatible host.
target_prefix: /usr
sysconfdir: /etc/strongswan
pid_dir: /run/crypton/strongswan
swanctl_dir: /etc/swanctl

# Only these plugins are enabled; default plugins remain disabled.
plugins:
  - openssl
  - vici
  - socket-default
  - kernel-netlink
  - nonce
  - random
  - x509
  - pubkey
  - pkcs1
  - pem
  - constraints
  - revocation

remarks: IPsec VPN implementation; built with swanctl and VICI support
